services:
  postgres:
    image: postgres:18
    container_name: numera-postgres
    environment:
      POSTGRES_DB: numera
      POSTGRES_USER: numera
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory; the volume MUST be
      # mounted at /var/lib/postgresql (not /var/lib/postgresql/data) or the image
      # refuses to start. See docker-library/postgres#37 and PR #1259.
      - numera-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numera -d numera"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: numera-keycloak
    # --import-realm imports every *-realm.json under /opt/keycloak/data/import on
    # startup (idempotent: skips a realm that already exists). The organization
    # feature backs Keycloak Organizations (one org per tenant/Mandant).
    command: start-dev --features=organization --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Resolves the realm's ${NUMERA_DOMAIN} placeholder (used by the prod redirect
      # URIs) to a valid value so the dev realm import doesn't fail on an invalid URI.
      NUMERA_DOMAIN: ${NUMERA_DOMAIN:-localhost}
    volumes:
      # Mount the realm export so --import-realm picks up realm-numera.json.
      - ./keycloak:/opt/keycloak/data/import:ro
      # Custom login theme (Numera brand); realm loginTheme=numera selects it.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"

  mailpit:
    # Local SMTP sink + web UI / HTTP API so dev + integration tests capture outbound
    # mail WITHOUT sending anything real (Phase-4 DOCS-03). MailKit sends to SMTP :1025;
    # the UI + assertable HTTP API answer on :8025. No auth (Mailpit accepts anonymously).
    image: axllent/mailpit:latest
    container_name: numera-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + HTTP API

  kosit-validator:
    # The GOVERNMENT-AUTHORITATIVE e-invoice validator (Phase-5 EINV-03). The official
    # KoSIT validator (itplr-kosit/validator) runs in DAEMON HTTP mode and is THE legal
    # definition of "conformant" for an XRechnung — every outbound (and inbound) e-invoice
    # XML is POSTed here and the returned XML report's computed accept/reject verdict gates
    # the send. Mirrors how Mailpit was added in Phase 4: a local sidecar, no auth, answering
    # over HTTP so both dev and Testcontainers integration tests can validate deterministically.
    #
    # PINNED (RESEARCH Pitfall 4 — config drift silently changes verdicts): this dev image
    # bundles the official KoSIT validator JAR 1.5.0 + validator-configuration-xrechnung for
    # XRechnung 3.0.2 (schematron 2.4.0, config release 2025-07-09) — XRechnung 3.0.2 is the
    # CURRENT PRODUCTION TARGET as of 2026-07 (NOT the XRechnung 4.0 pre-release, which is
    # mid-2026 early-visibility only, non-production; the 4.0 move is a future pinned-config
    # swap seam, not v1). Pinned to an EXPLICIT tag (NEVER :latest — a rebuilt :latest would
    # change verdicts with no code change).
    #
    # NOTE — the community image the research named (apps4everything/kosit-docker:1.6.0, JAR
    # 1.6.0 + config 2026-01-31) does NOT exist on Docker Hub; easybill/…_3.0.2:v0.2.7 is the
    # real, pullable, explicitly-tagged XRechnung-3.0.2 daemon image (JAR 1.5.0, config release
    # 2025-07-09 — same 3.0.2 ruleset, an earlier point release). For PRODUCTION build our OWN
    # image from the pinned official JAR + the intended validator-configuration-xrechnung release
    # for full reproducibility + update control (RESEARCH Alternatives: SaaS/:latest rejected for
    # the compliance core; the config version is a pinned build arg + the single change-locus for
    # the eventual XRechnung 4.0 swap).
    #
    # Daemon HTTP: the entrypoint runs the validator with -D (daemon) -H 0.0.0.0 --disable-gui,
    # serving on container port 8080. POST the invoice XML to the root path "/" (multipart or raw)
    # and it returns the KoSIT XML report. Exposed on host :8081 (the app's EInvoiceValidation
    # BaseUrl).
    image: easybill/kosit-validator-xrechnung_3.0.2:v0.2.7
    container_name: numera-kosit-validator
    ports:
      - "8081:8080" # KoSIT daemon HTTP (host 8081 → container 8080)

volumes:
  numera-postgres-data:
  numera-keycloak-data:
