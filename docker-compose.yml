services:
  postgres:
    image: postgres:18
    container_name: numera-postgres
    environment:
      POSTGRES_DB: numera
      POSTGRES_USER: numera
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory; the volume MUST be
      # mounted at /var/lib/postgresql (not /var/lib/postgresql/data) or the image
      # refuses to start. See docker-library/postgres#37 and PR #1259.
      - numera-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numera -d numera"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: numera-keycloak
    # --import-realm imports every *-realm.json under /opt/keycloak/data/import on
    # startup (idempotent: skips a realm that already exists). The organization
    # feature backs Keycloak Organizations (one org per tenant/Mandant).
    command: start-dev --features=organization --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # Mount the realm export so --import-realm picks up realm-numera.json.
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  mailpit:
    # Local SMTP sink + web UI / HTTP API so dev + integration tests capture outbound
    # mail WITHOUT sending anything real (Phase-4 DOCS-03). MailKit sends to SMTP :1025;
    # the UI + assertable HTTP API answer on :8025. No auth (Mailpit accepts anonymously).
    image: axllent/mailpit:latest
    container_name: numera-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + HTTP API

  kosit-validator:
    # The GOVERNMENT-AUTHORITATIVE e-invoice validator (Phase-5 EINV-03). The official
    # KoSIT validator (itplr-kosit/validator) runs in DAEMON HTTP mode and is THE legal
    # definition of "conformant" for an XRechnung — every outbound (and inbound) e-invoice
    # XML is POSTed here and the returned XML report's computed accept/reject verdict gates
    # the send. Mirrors how Mailpit was added in Phase 4: a local sidecar, no auth, answering
    # over HTTP so both dev and Testcontainers integration tests can validate deterministically.
    #
    # PINNED (RESEARCH Pitfall 4 — config drift silently changes verdicts): validator JAR
    # 1.6.0 + validator-configuration-xrechnung release 2026-01-31 → XRechnung 3.0.2, which is
    # the CURRENT PRODUCTION TARGET as of 2026-07. NOT the older 2025-03-21 config and NOT the
    # XRechnung 4.0 pre-release (mid-2026 early-visibility only, non-production; the 4.0 move is
    # a future pinned-config swap seam, not v1). The apps4everything/kosit-docker image bundles
    # both for dev speed; it is pinned to an EXPLICIT tag (NEVER :latest — a rebuilt :latest
    # would change verdicts with no code change). PRODUCTION should build our OWN image from the
    # pinned official JAR 1.6.0 + config 2026-01-31 for full reproducibility + update control
    # (RESEARCH Alternatives: SaaS/:latest rejected for the compliance core).
    #
    # Daemon HTTP: the image serves the KoSIT daemon on container port 8080; POST the invoice
    # XML (application/xml) to the root path "/" and it returns the KoSIT XML report. Exposed on
    # host :8081 (the app's EInvoiceValidation:BaseUrl).
    image: apps4everything/kosit-docker:1.6.0
    container_name: numera-kosit-validator
    ports:
      - "8081:8080" # KoSIT daemon HTTP (host 8081 → container 8080)

volumes:
  numera-postgres-data:
